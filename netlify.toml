# Netlify config. Netlify serves the repo statically AND runs the function that
# holds the Clockify key. (GitHub Pages can keep serving ftnn-status.html too —
# the /status loader only calls Netlify for the live budget JSON.)
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The Squarespace /status embed fetches these from fetaltherapynursenetwork.org,
# so they need CORS (GitHub Pages used to send this by default).
[[headers]]
  for = "/ftnn-status.html"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

[[headers]]
  for = "/status-loader.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"
