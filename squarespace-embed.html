<!-- =====================================================================
     SQUARESPACE  /status  PAGE — paste this ONCE into a Code Block.
     This is a permanent bootstrap: it never needs re-pasting. It loads the
     latest status content AND the latest loader logic live from GitHub Pages,
     so every update (content, budget, engagement) goes live on `git push`.
     ===================================================================== -->
<div id="ftnn-status-mount" style="min-height:200px;font-family:-apple-system,Segoe UI,sans-serif;color:#6b7e89;padding:24px;">Loading status…</div>
<script>
(function(){
  var BASE = "https://garyricke.github.io/ftnn-status/";
  var mount = document.getElementById("ftnn-status-mount");
  fetch(BASE + "ftnn-status.html?v=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){
      mount.innerHTML = html;
      var s = document.createElement("script");
      s.src = BASE + "status-loader.js?v=" + Date.now();
      document.body.appendChild(s);
    })
    .catch(function(e){
      mount.innerHTML = '<p style="color:#b42318;padding:24px;">Status is temporarily unavailable. Please refresh in a moment.</p>';
      console.error("FTNN status load failed:", e);
    });
})();
</script>
